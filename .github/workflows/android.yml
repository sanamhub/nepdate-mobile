name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - "tools/**"
      - "fastlane/**"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - "tools/**"
      - "fastlane/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Gradle ci
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the Android gates
        working-directory: android
        run: ./gradlew ci --no-daemon

      - name: Upload the Roborazzi images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi
          path: android/app/src/test/screenshots
          if-no-files-found: ignore

  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # For debugging only: debuggable, not shrunk and without the Baseline Profile, so it runs
      # slower than the store build. Testers install tester-apk instead.
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Testers install THIS one, not debug-apk. It is the release build (R8 and resource shrinking, not
  # debuggable, Baseline Profile and startup profile included), so it runs like the store build.
  # It is signed with the TESTER_* repository secrets when they exist, so each build installs over
  # the last one. Without them (forks, or before they are added) it uses a throwaway key made in this
  # job, and Android will not install it over a build from another run: uninstall the old one first.
  # Never the upload key. The package name is np.nepdate, the same as debug-apk.
  tester-apk:
    name: Tester APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # TESTER_* secrets hold a key made for testers only. It is never the upload key and is never
      # kept in a file in the repository. Forks, and runs before the secrets exist, get no secrets,
      # so they fall back to a throwaway key made here.
      - name: Choose the signing key
        id: key
        env:
          TESTER_KEYSTORE_BASE64: ${{ secrets.TESTER_KEYSTORE_BASE64 }}
          TESTER_KEYSTORE_PASSWORD: ${{ secrets.TESTER_KEYSTORE_PASSWORD }}
          TESTER_KEY_ALIAS: ${{ secrets.TESTER_KEY_ALIAS }}
          TESTER_KEY_PASSWORD: ${{ secrets.TESTER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/tester.jks"
          if [ -n "$TESTER_KEYSTORE_BASE64" ] && [ -n "$TESTER_KEYSTORE_PASSWORD" ]              && [ -n "$TESTER_KEY_ALIAS" ] && [ -n "$TESTER_KEY_PASSWORD" ]; then
            printf '%s' "$TESTER_KEYSTORE_BASE64" | base64 --decode > "$store"
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "A stable tester key is in use: an update installs over the last build."
          else
            keytool -genkeypair -keystore "$store" -storepass android -keypass android               -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
            echo "::notice::No tester key secrets here, so this build uses a throwaway key. Uninstall the old build before installing it."
          fi

      - name: Build the release APK signed with that key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tester.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.key.outputs.kind == 'stable' && secrets.TESTER_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ steps.key.outputs.kind == 'stable' && secrets.TESTER_KEY_ALIAS || 'androiddebugkey' }}
          ANDROID_KEY_PASSWORD: ${{ steps.key.outputs.kind == 'stable' && secrets.TESTER_KEY_PASSWORD || 'android' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/tester.jks"

      - name: Check the APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$aapt2" dump badging "$apk" | grep -E "^package:|^sdkVersion|^targetSdkVersion"
          if "$aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "the tester APK is debuggable"
            exit 1
          fi
          echo "not debuggable"
          unzip -l "$apk" | grep "assets/dexopt/baseline.prof"
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "size: $(stat -c%s "$apk") bytes"

      - name: Upload the tester APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Not in the APK. A crash trace from a tester is retraced with this file and the R8 retrace
      # tool, and it matches only the APK from this same run.
      - name: Upload the R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-apk-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  # The shrunk release build must start. Debug builds and unit tests do not run R8, so a keep rule
  # that is missing shows up only here. The test puts the crash log in its failure message.
  launch-smoke-test:
    name: Launch smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Start the release build on the managed device
        working-directory: android
        run: >
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=np.nepdate.baselineprofile.LaunchSmokeTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --no-daemon

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-smoke-report
          path: android/baselineprofile/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14

  release-workflow:
    name: Release workflow (static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Check the release workflow
        run: python3 tools/check_android_release_workflow.py

  apk-a:
    name: Reproducible APK A
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # A3-01: no restored Gradle cache and no build cache, so each APK is built from source and
      # the comparison cannot pass on task outputs both jobs read from the same cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-build-cache

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-a
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  apk-b:
    name: Reproducible APK B
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # A3-01: no restored Gradle cache and no build cache, so each APK is built from source and
      # the comparison cannot pass on task outputs both jobs read from the same cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-build-cache

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-b
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  compare-apks:
    name: Compare APK checksums
    needs: [apk-a, apk-b]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK A
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-a
          path: apk-a

      - name: Download APK B
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-b
          path: apk-b

      - name: Compare SHA-256
        run: |
          set -euo pipefail
          a="$(find apk-a -name 'app-release-unsigned.apk' -print -quit)"
          b="$(find apk-b -name 'app-release-unsigned.apk' -print -quit)"
          test -n "$a"
          test -n "$b"
          sha256sum "$a" "$b"
          test "$(sha256sum "$a" | cut -d' ' -f1)" = "$(sha256sum "$b" | cut -d' ' -f1)"
