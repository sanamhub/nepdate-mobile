name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - "tools/**"
      - "fastlane/**"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - "tools/**"
      - "fastlane/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Gradle ci
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out nepdate-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sanamhub/nepdate-kotlin
          ref: 4994a336ac31db6767430c451da61554ee933d1a
          path: nepdate-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run the Android gates
        working-directory: android
        run: ./gradlew ci --no-daemon

      - name: Upload the Roborazzi images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi
          path: android/app/src/test/screenshots
          if-no-files-found: ignore

  release-workflow:
    name: Release workflow (static)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Check the release workflow
        run: python3 tools/check_android_release_workflow.py

  apk-a:
    name: Reproducible APK A
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out nepdate-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sanamhub/nepdate-kotlin
          ref: 4994a336ac31db6767430c451da61554ee933d1a
          path: nepdate-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # A3-01: no restored Gradle cache and no build cache, so each APK is built from source and
      # the comparison cannot pass on task outputs both jobs read from the same cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-build-cache

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-a
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  apk-b:
    name: Reproducible APK B
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out nepdate-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sanamhub/nepdate-kotlin
          ref: 4994a336ac31db6767430c451da61554ee933d1a
          path: nepdate-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # A3-01: no restored Gradle cache and no build cache, so each APK is built from source and
      # the comparison cannot pass on task outputs both jobs read from the same cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --no-build-cache

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-b
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  compare-apks:
    name: Compare APK checksums
    needs: [apk-a, apk-b]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK A
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-a
          path: apk-a

      - name: Download APK B
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-b
          path: apk-b

      - name: Compare SHA-256
        run: |
          set -euo pipefail
          a="$(find apk-a -name 'app-release-unsigned.apk' -print -quit)"
          b="$(find apk-b -name 'app-release-unsigned.apk' -print -quit)"
          test -n "$a"
          test -n "$b"
          sha256sum "$a" "$b"
          test "$(sha256sum "$a" | cut -d' ' -f1)" = "$(sha256sum "$b" | cut -d' ' -f1)"
