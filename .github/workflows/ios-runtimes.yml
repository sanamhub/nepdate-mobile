name: iOS runtimes

# Temporary: reports what each macOS image offers, for ADR-0014. Deleted before the PR merges.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xcode-27
            xcode: /Applications/Xcode_27.1.app
          - image: macos-26
            xcode: /Applications/Xcode_26.6.app
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15

    steps:
      - name: List the Xcodes
        run: ls -d /Applications/Xcode*.app

      - name: Select Xcode
        env:
          XCODE_APP: ${{ matrix.xcode }}
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "xcode: $XCODE_APP is not on this runner image"
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Show the runtimes
        run: xcrun simctl list runtimes

      - name: Show the devices
        run: xcrun simctl list devices available

      - name: Show the SDKs
        run: xcodebuild -showsdks
