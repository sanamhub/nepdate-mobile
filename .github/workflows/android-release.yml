name: Android release

# A3-02: this workflow is written and statically tested in A3. It is not run in this phase.
# A human creates the tag and approves the production environment. Promotion from the internal
# track stays manual in Play Console.

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only, without signing, Play upload or a release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_date: ${{ steps.version.outputs.release_date }}
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Resolve the version and the UTC release date
        id: version
        run: |
          set -euo pipefail
          # Always read the build file, so the tag check below compares two independent sources.
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::versionName is missing from android/app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Tag matches versionName
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Manual run: there is no tag to compare."
            exit 0
          fi
          if [[ "${REF_NAME#android-v}" != "$VERSION" ]]; then
            echo "::error::tag $REF_NAME does not match versionName $VERSION"
            exit 1
          fi

      - name: Changelog section exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -q "^## \\[$VERSION\\]" android/CHANGELOG.md; then
            echo "::error::android/CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Check out nepdate-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sanamhub/nepdate-kotlin
          ref: 4994a336ac31db6767430c451da61554ee933d1a
          path: nepdate-kotlin
          persist-credentials: false

      - name: Data freshness gate
        env:
          RELEASE_DATE: ${{ steps.version.outputs.release_date }}
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --tests np.nepdate.release.DataFreshnessTest --no-daemon
          cat app/build/release-data-status.txt

  ci:
    name: Gradle ci
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out nepdate-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sanamhub/nepdate-kotlin
          ref: 4994a336ac31db6767430c451da61554ee933d1a
          path: nepdate-kotlin
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run the Android gates
        working-directory: android
        run: ./gradlew ci --no-daemon

  sign:
    name: Build and sign
    needs: [preflight, ci]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out nepdate-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sanamhub/nepdate-kotlin
          ref: 4994a336ac31db6767430c451da61554ee933d1a
          path: nepdate-kotlin
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty in the production environment"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify the signatures
        working-directory: android
        run: |
          set -euo pipefail
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab

      - name: Collect the release artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/NepDate-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/NepDate-$VERSION.aab"
          cp android/app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          cd dist
          sha256sum "NepDate-$VERSION.apk" "NepDate-$VERSION.aab" > SHA256SUMS
          cat SHA256SUMS

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload the signed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          if-no-files-found: error
          path: dist/*

  publish:
    name: Play internal track
    needs: sign
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # settings.gradle.kts includes nepdate-kotlin, so Gradle cannot configure the app without it.
      - name: Check out nepdate-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sanamhub/nepdate-kotlin
          ref: 4994a336ac31db6767430c451da61554ee933d1a
          path: nepdate-kotlin
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Download the signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: artifacts

      - name: Check the signed artifacts against SHA256SUMS
        working-directory: artifacts
        run: sha256sum --check --strict SHA256SUMS

      - name: Upload the AAB to the internal track
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        working-directory: android
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_PUBLISHER_CREDENTIALS" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is empty in the production environment"
            exit 1
          fi
          ./gradlew :app:publishReleaseBundle --artifact-dir="$GITHUB_WORKSPACE/artifacts" --track=internal --no-daemon

  attest:
    name: Attest
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: artifacts

      - name: Create the provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.apk
            artifacts/*.aab

      - name: Collect the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" attestation.json

      - name: Upload the attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation
          if-no-files-found: error
          path: attestation.json

  release:
    name: Draft GitHub Release
    needs: [preflight, sign, attest]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: artifacts

      - name: Download the attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation
          path: artifacts

      - name: Check the signed artifacts against SHA256SUMS
        working-directory: artifacts
        run: sha256sum --check --strict SHA256SUMS

      - name: Build the release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' android/CHANGELOG.md > notes.md

      - name: Create the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          draft: true
          prerelease: false
          files: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/SHA256SUMS
            artifacts/attestation.json
