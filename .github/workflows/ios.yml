name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: Record the reference snapshots instead of comparing them.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Xcode ci
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SNAPSHOT_TESTING_RECORD: ${{ inputs.record_snapshots && 'all' || 'never' }}

    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image's default Xcode changes without notice; select one by path so a build can be
      # repeated. 26.6 and not the xcode-27 image: the gates fail on iOS 27 (ADR-0014).
      - name: Select Xcode
        env:
          XCODE_APP: /Applications/Xcode_26.6.app
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$XCODE_APP" ]; then
            echo "xcode: $XCODE_APP is not on this runner image"
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show the Xcode version
        run: xcodebuild -version

      # The simulator destination is pinned by name and OS, so it is listed here too: a renamed
      # device or a withdrawn runtime shows up before the gates run.
      - name: Show the simulators
        run: xcrun simctl list devices available

      - name: Run the iOS gates
        working-directory: ios
        run: ./scripts/ci.sh

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: ios/build/snapshots
          if-no-files-found: error

      - name: Upload the snapshot references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-snapshot-references
          path: ios/NepDateTests/__Snapshots__
          if-no-files-found: ignore

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-coverage
          path: ios/build/coverage.json
          if-no-files-found: ignore

      # The UI tests attach screenshots of the month bar to the result bundle. Exporting them
      # makes them reviewable from the run page, without opening the bundle in Xcode.
      - name: Export the test attachments
        if: always()
        continue-on-error: true
        working-directory: ios
        run: |
          xcrun xcresulttool export attachments \
            --path build/TestResults.xcresult \
            --output-path build/attachments
          ls -l build/attachments

      - name: Upload the test attachments
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-attachments
          path: ios/build/attachments
          if-no-files-found: ignore
