name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Xcode ci
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image's default Xcode changes without notice; select one by path so a build can be
      # repeated. See ios/README.md for why this is 26.6 and not 27.x.
      - name: Select Xcode
        env:
          XCODE_APP: /Applications/Xcode_26.6.app
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$XCODE_APP" ]; then
            echo "xcode: $XCODE_APP is not on this runner image"
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Run the iOS gates
        working-directory: ios
        run: ./scripts/ci.sh

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: ios/build/snapshots
          if-no-files-found: error

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-coverage
          path: ios/build/coverage.json
          if-no-files-found: ignore
